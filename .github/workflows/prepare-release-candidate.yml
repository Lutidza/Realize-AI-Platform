# @file .github/workflows/prepare-release-candidate.yml
# @version 1.1.0
# @date 2026-10-05
# @description Готовит подписанный OCI-кандидат с exact source inventory и отдельным preview.
name: Prepare release candidate
run-name: Realize release candidate ${{ inputs.candidate_key }}

on:
  workflow_dispatch:
    inputs:
      candidate_key:
        description: Immutable release candidate key
        required: true
        type: string
      change_request_id:
        description: Payload Change Request ID
        required: true
        type: string
      expires_at:
        description: Candidate expiry in canonical ISO-8601 UTC form
        required: true
        type: string
      git_commit:
        description: Exact service commit to build
        required: true
        type: string
      source_acceptance_hash:
        description: Exact local preview acceptance hash
        required: true
        type: string
      source_preview_artifact_hash:
        description: Exact local preview artifact hash
        required: true
        type: string
      source_preview_evidence_hash:
        description: Exact local preview evidence hash
        required: true
        type: string

concurrency:
  cancel-in-progress: false
  group: release-candidate-${{ inputs.candidate_key }}

permissions: {}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ inputs.git_commit }}
      require_agent_baseline: true

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      git_commit_created_at: ${{ steps.metadata.outputs.git_commit_created_at }}
      image_digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.metadata.outputs.image_ref }}
      provenance_ref: ${{ steps.metadata.outputs.provenance_ref }}
      sbom_digest: ${{ steps.metadata.outputs.sbom_digest }}
      signature_ref: ${{ steps.metadata.outputs.signature_ref }}
    steps:
      - name: Validate immutable candidate inputs
        env:
          CANDIDATE_KEY: ${{ inputs.candidate_key }}
          CHANGE_REQUEST_ID: ${{ inputs.change_request_id }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          GIT_COMMIT: ${{ inputs.git_commit }}
          SOURCE_ACCEPTANCE_HASH: ${{ inputs.source_acceptance_hash }}
          SOURCE_PREVIEW_ARTIFACT_HASH: ${{ inputs.source_preview_artifact_hash }}
          SOURCE_PREVIEW_EVIDENCE_HASH: ${{ inputs.source_preview_evidence_hash }}
        run: |
          [[ "$CANDIDATE_KEY" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CHANGE_REQUEST_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          [[ "$GIT_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_ACCEPTANCE_HASH" =~ ^[a-f0-9]{64}$ ]]
          [[ "$SOURCE_PREVIEW_ARTIFACT_HASH" =~ ^[a-f0-9]{64}$ ]]
          [[ "$SOURCE_PREVIEW_EVIDENCE_HASH" =~ ^[a-f0-9]{64}$ ]]
          node -e "const value=process.env.EXPIRES_AT; if(new Date(value).toISOString()!==value || Date.parse(value)<=Date.now()) process.exit(1)"

      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.git_commit }}

      - name: Verify candidate checkout identity
        env:
          GIT_COMMIT: ${{ inputs.git_commit }}
        run: test "$(git rev-parse HEAD)" = "$GIT_COMMIT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - name: Resolve candidate image repository
        id: image
        env:
          CANDIDATE_KEY: ${{ inputs.candidate_key }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repository=ghcr.io/${owner}/realize-e-commerce" >> "$GITHUB_OUTPUT"
          echo "tag=candidate-${CANDIDATE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Build and push exact candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          labels: |
            org.opencontainers.image.revision=${{ inputs.git_commit }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            realize.change-request=${{ inputs.change_request_id }}
            realize.release-candidate=${{ inputs.candidate_key }}
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          target: runtime

      - name: Scan immutable candidate image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0, immutable safe release
        with:
          exit-code: "1"
          format: table
          ignore-unfixed: true
          image-ref: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign exact digest with GitHub OIDC identity
        env:
          CANDIDATE_KEY: ${{ inputs.candidate_key }}
          GIT_COMMIT: ${{ inputs.git_commit }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          cosign sign --yes \
            -a "realize.candidate-key=${CANDIDATE_KEY}" \
            -a "realize.git-commit=${GIT_COMMIT}" \
            "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

      - name: Extract and verify security evidence
        id: metadata
        env:
          CANDIDATE_KEY: ${{ inputs.candidate_key }}
          GIT_COMMIT: ${{ inputs.git_commit }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          mkdir -p artifacts/build
          image_ref="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "$image_ref" --format '{{ json .SBOM }}' > artifacts/build/sbom.spdx.json
          docker buildx imagetools inspect "$image_ref" --format '{{ json .Provenance }}' > artifacts/build/provenance.json
          node -e "for(const path of ['artifacts/build/sbom.spdx.json','artifacts/build/provenance.json']) { const value=JSON.parse(require('fs').readFileSync(path,'utf8')); if(!value || typeof value!=='object' || !Object.keys(value).length) process.exit(1) }"
          cosign verify \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            -a "realize.candidate-key=${CANDIDATE_KEY}" \
            -a "realize.git-commit=${GIT_COMMIT}" \
            "$image_ref" > artifacts/build/signature-verification.json
          sbom_digest="sha256:$(sha256sum artifacts/build/sbom.spdx.json | cut -d ' ' -f 1)"
          git_commit_created_at="$(git show -s --format=%cI "$GIT_COMMIT")"
          {
            echo "git_commit_created_at=$git_commit_created_at"
            echo "image_ref=$image_ref"
            echo "provenance_ref=oci://${image_ref}#buildkit-provenance"
            echo "sbom_digest=$sbom_digest"
            echo "signature_ref=oci://${image_ref}#sigstore:${GITHUB_WORKFLOW_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload build evidence for the isolated preview job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: release-build-${{ inputs.candidate_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/build
          retention-days: 2

  preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-preview
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted delivery assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false

      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
          ref: ${{ inputs.git_commit }}

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Download exact build evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-build-${{ inputs.candidate_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/build

      - name: Install trusted manifest dependencies
        working-directory: trusted
        run: |
          npm install --global npm@11.15.0
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate release-preview environment
        env:
          DEPLOY_HOST: ${{ secrets.PREVIEW_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PREVIEW_DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.PREVIEW_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.PREVIEW_DEPLOY_USER }}
          INSTALLATION_ID: ${{ vars.REALIZE_INSTALLATION_ID }}
          PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}
          PREVIEW_PORT_MAX: ${{ vars.PREVIEW_PORT_MAX }}
          PREVIEW_PORT_MIN: ${{ vars.PREVIEW_PORT_MIN }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
          [[ "$DEPLOY_HOST" != *..* ]]
          [[ "$DEPLOY_PATH" =~ ^(/[A-Za-z0-9._-]+)+/realize-release-previews$ ]]
          [[ "$DEPLOY_PATH" != *"/../"* && "$DEPLOY_PATH" != *"/./"* && "$DEPLOY_PATH" != *"//"* ]]
          [[ "${DEPLOY_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          (( ${DEPLOY_PORT:-22} >= 1 && ${DEPLOY_PORT:-22} <= 65535 ))
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ "$INSTALLATION_ID" =~ ^[A-Za-z0-9._:-]{1,200}$ ]]
          [[ "$PREVIEW_BASE_DOMAIN" =~ ^[a-z0-9][a-z0-9.-]{1,251}[a-z0-9]$ ]]
          [[ "$PREVIEW_BASE_DOMAIN" != *..* ]]
          [[ "$PREVIEW_PORT_MIN" =~ ^[0-9]{4,5}$ ]]
          [[ "$PREVIEW_PORT_MAX" =~ ^[0-9]{4,5}$ ]]

      - name: Configure pinned preview SSH host
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PREVIEW_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.PREVIEW_DEPLOY_SSH_KEY }}
        run: |
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy exact digest to isolated VPS preview
        env:
          CANDIDATE_KEY: ${{ inputs.candidate_key }}
          DEPLOY_HOST: ${{ secrets.PREVIEW_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PREVIEW_DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.PREVIEW_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.PREVIEW_DEPLOY_USER }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          GIT_COMMIT: ${{ inputs.git_commit }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}
          PREVIEW_PORT_MAX: ${{ vars.PREVIEW_PORT_MAX }}
          PREVIEW_PORT_MIN: ${{ vars.PREVIEW_PORT_MIN }}
        run: |
          port="${DEPLOY_PORT:-22}"
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_options[@]}" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/runtime'"
          scp "${ssh_options[@]}" -P "$port" trusted/compose.release-preview.yaml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/runtime/compose.release-preview.yaml"
          scp "${ssh_options[@]}" -P "$port" trusted/scripts/deploy/release-preview-nginx.conf "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/runtime/release-preview-nginx.conf"
          scp "${ssh_options[@]}" -P "$port" trusted/scripts/deploy/remote-release-preview.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/runtime/remote-release-preview.sh"
          preview_json="$(ssh "${ssh_options[@]}" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && PREVIEW_DEPLOY_ROOT='$DEPLOY_PATH' CANDIDATE_KEY='$CANDIDATE_KEY' EXPIRES_AT='$EXPIRES_AT' GIT_COMMIT='$GIT_COMMIT' PREVIEW_BASE_DOMAIN='$PREVIEW_BASE_DOMAIN' PREVIEW_PORT_MIN='$PREVIEW_PORT_MIN' PREVIEW_PORT_MAX='$PREVIEW_PORT_MAX' REALIZE_IMAGE='$IMAGE_REF' bash runtime/remote-release-preview.sh deploy")"
          mkdir -p artifacts
          printf '%s\n' "$preview_json" > artifacts/preview.json
          node -e "const value=JSON.parse(require('fs').readFileSync('artifacts/preview.json','utf8')); if(value.candidateKey!==process.env.CANDIDATE_KEY || value.gitCommit!==process.env.GIT_COMMIT || value.previewStatus!=='healthy') process.exit(1)"

      - name: Create exact release manifest and evidence
        env:
          CANDIDATE_KEY: ${{ inputs.candidate_key }}
          CHANGE_REQUEST_ID: ${{ inputs.change_request_id }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          GIT_COMMIT: ${{ inputs.git_commit }}
          GIT_COMMIT_CREATED_AT: ${{ needs.build.outputs.git_commit_created_at }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          INSTALLATION_ID: ${{ vars.REALIZE_INSTALLATION_ID }}
          ORCHESTRATOR_REFERENCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROVENANCE_REF: ${{ needs.build.outputs.provenance_ref }}
          SBOM_DIGEST: ${{ needs.build.outputs.sbom_digest }}
          SIGNATURE_REF: ${{ needs.build.outputs.signature_ref }}
          SOURCE_ACCEPTANCE_HASH: ${{ inputs.source_acceptance_hash }}
          SOURCE_PREVIEW_ARTIFACT_HASH: ${{ inputs.source_preview_artifact_hash }}
          SOURCE_PREVIEW_EVIDENCE_HASH: ${{ inputs.source_preview_evidence_hash }}
        run: |
          node trusted/scripts/release/create-release-candidate-evidence.mjs \
            candidate \
            artifacts/preview.json \
            artifacts/build/sbom.spdx.json \
            artifacts/build/provenance.json \
            artifacts/build/signature-verification.json \
            artifacts/final

      - name: Upload exact candidate handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: release-candidate-${{ inputs.candidate_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/final
          retention-days: 30
