name: Cleanup expired release previews

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  cancel-in-progress: false
  group: cleanup-release-previews

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-preview
    steps:
      - name: Checkout trusted cleanup assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate preview deployment target
        env:
          DEPLOY_HOST: ${{ secrets.PREVIEW_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PREVIEW_DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.PREVIEW_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.PREVIEW_DEPLOY_USER }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
          [[ "$DEPLOY_HOST" != *..* ]]
          [[ "$DEPLOY_PATH" =~ ^(/[A-Za-z0-9._-]+)+/realize-release-previews$ ]]
          [[ "$DEPLOY_PATH" != *"/../"* && "$DEPLOY_PATH" != *"/./"* && "$DEPLOY_PATH" != *"//"* ]]
          [[ "${DEPLOY_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          (( ${DEPLOY_PORT:-22} >= 1 && ${DEPLOY_PORT:-22} <= 65535 ))
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]

      - name: Configure pinned preview SSH host
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PREVIEW_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.PREVIEW_DEPLOY_SSH_KEY }}
        run: |
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Refresh runtime assets and remove expired projects
        env:
          DEPLOY_HOST: ${{ secrets.PREVIEW_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.PREVIEW_DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.PREVIEW_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.PREVIEW_DEPLOY_USER }}
        run: |
          port="${DEPLOY_PORT:-22}"
          ssh_options=(-o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_options[@]}" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/runtime'"
          scp "${ssh_options[@]}" -P "$port" compose.release-preview.yaml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/runtime/compose.release-preview.yaml"
          scp "${ssh_options[@]}" -P "$port" scripts/deploy/release-preview-nginx.conf "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/runtime/release-preview-nginx.conf"
          scp "${ssh_options[@]}" -P "$port" scripts/deploy/remote-release-preview.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/runtime/remote-release-preview.sh"
          ssh "${ssh_options[@]}" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && PREVIEW_DEPLOY_ROOT='$DEPLOY_PATH' bash runtime/remote-release-preview.sh cleanup"
