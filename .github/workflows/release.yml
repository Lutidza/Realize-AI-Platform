name: Release and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Promote the verified digest to production after staging
        required: true
        type: boolean
        default: false

concurrency:
  cancel-in-progress: false
  group: release-${{ github.ref }}

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_repository: ${{ steps.image.outputs.repository }}
      release_id: ${{ steps.image.outputs.release_id }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve immutable image identity
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repository=ghcr.io/${owner}/realize-e-commerce" >> "$GITHUB_OUTPUT"
          echo "release_id=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.release_id }}
          target: runtime

      - name: Scan immutable image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          exit-code: "1"
          format: table
          ignore-unfixed: true
          image-ref: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Create release manifest
        env:
          GIT_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          RELEASE_ID: ${{ steps.image.outputs.release_id }}
        run: node scripts/release/create-release-manifest.mjs

      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: release-manifest-${{ steps.image.outputs.release_id }}
          path: artifacts/release-manifest.json
          retention-days: 90

  deploy-staging:
    needs: image
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: staging
      image: ${{ needs.image.outputs.image_repository }}@${{ needs.image.outputs.digest }}
      release_id: ${{ needs.image.outputs.release_id }}
    secrets: inherit

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    needs:
      - image
      - deploy-staging
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: production
      image: ${{ needs.image.outputs.image_repository }}@${{ needs.image.outputs.digest }}
      release_id: ${{ needs.image.outputs.release_id }}
    secrets: inherit
