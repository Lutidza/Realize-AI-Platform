<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'"
    />
    <title>Вход в тестовое досье | Realize</title>
    <link rel="stylesheet" href="/audit-dossier-login/style.css" />
    <script src="/audit-dossier-login/login.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Вход в тестовое досье</h1>
      <p>Используйте учётную запись тестового оркестратора.</p>
      <form method="post" action="/api/users/login">
        <label
          >Электронная почта<input
            type="email"
            name="email"
            autocomplete="username"
            required
        /></label>
        <label
          >Пароль<input
            type="password"
            name="password"
            autocomplete="current-password"
            required
        /></label>
        <button type="submit">Войти</button>
        <p role="alert"></p>
      </form>
    </main>
  </body>
</html>
