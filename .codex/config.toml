# @file .codex/config.toml
# @version 1.0.2
# @date 2026-10-23
# @description Настраивает клиентские development MCP проекта без хранения секретов.
# Project-local Codex adapter config.
#
# MCP source of truth:
# - .codex/config.toml stores project-specific Codex MCP adapter entries.
# - .ai/rules/external-tools/RULE-MCP-TOOLING-CONTOUR.md stores active policy.
# - documentation/architecture/mcp-tooling.md stores project-facing context.
#
# Mirror entries into the active Codex runtime only when required by that
# runtime. Do not restore stale servers, store secrets here or treat
# session-provided tools as permanent project configuration.

[mcp_servers.recommerce-playwright]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.76"]

[mcp_servers.recommerce-tailwind]
command = "npx"
args = ["-y", "tailwindcss-mcp-server@0.1.1"]

[mcp_servers.recommerce-next-devtools]
command = "npx"
args = ["-y", "next-devtools-mcp@0.3.10"]
env = { NEXT_TELEMETRY_DISABLED = "1" }

[mcp_servers.realize-internal]
url = "http://127.0.0.1:4319/mcp"
http_headers_helper = "node scripts/runtime/readLocalMcpHeaders.controller.mjs"
startup_timeout_sec = 20
tool_timeout_sec = 30

[features]
multi_agent = false
multi_agent_v2 = false
