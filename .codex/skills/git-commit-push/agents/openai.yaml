interface:
  display_name: "Git через разрешённый адаптер"
  short_description: "Программный inspect и модельные Git-воркеры"
  default_prompt: "Используй $git-commit-push: inspect выполняй через программный адаптер без модели, остальные разрешённые Git-операции передавай отдельному воркеру без истории диалога."

policy:
