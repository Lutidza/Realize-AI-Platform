services:
  postgres:
    image: postgres:15.18-bookworm@sha256:e8db9bd3e9e1751eb639fb17be53cc6d1b62a322adf75b99e791767a7a16ce69
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PREVIEW_POSTGRES_DB:?PREVIEW_POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${PREVIEW_POSTGRES_PASSWORD:?PREVIEW_POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${PREVIEW_POSTGRES_USER:?PREVIEW_POSTGRES_USER is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    image: ${REALIZE_IMAGE:?REALIZE_IMAGE is required}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URI: postgres://${PREVIEW_POSTGRES_USER}:${PREVIEW_POSTGRES_PASSWORD}@postgres:5432/${PREVIEW_POSTGRES_DB}
      DATABASE_URL: postgres://${PREVIEW_POSTGRES_USER}:${PREVIEW_POSTGRES_PASSWORD}@postgres:5432/${PREVIEW_POSTGRES_DB}
      NEXT_PUBLIC_SERVER_URL: ${PREVIEW_PUBLIC_URL:?PREVIEW_PUBLIC_URL is required}
      NEXT_PUBLIC_SITE_URL: ${PREVIEW_PUBLIC_URL:?PREVIEW_PUBLIC_URL is required}
      PAYLOAD_PUBLIC_SERVER_URL: ${PREVIEW_PUBLIC_URL:?PREVIEW_PUBLIC_URL is required}
      PAYLOAD_PUBLIC_SITE_URL: ${PREVIEW_PUBLIC_URL:?PREVIEW_PUBLIC_URL is required}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?PREVIEW_SECRET is required}
      REALIZE_AI_ENABLED: "false"
      REALIZE_AI_RUNTIME_MODE: central-control-plane
      RELEASE_ID: ${CANDIDATE_KEY:?CANDIDATE_KEY is required}
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOKS_SIGNING_SECRET: ""
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks:
      - backend
    tmpfs:
      - /app/.next/standalone/.next/cache:uid=1001,gid=1001,mode=0750
      - /tmp:uid=1001,gid=1001,mode=1777
    volumes:
      - ${PREVIEW_MEDIA_PATH:?PREVIEW_MEDIA_PATH is required}:/app/public/media:ro

  proxy:
    image: nginx:1.30.4-alpine3.24@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend
      - backend
    ports:
      - ${PREVIEW_BIND_ADDRESS:-0.0.0.0}:${PREVIEW_HTTPS_PORT:?PREVIEW_HTTPS_PORT is required}:8443
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0750
      - /tmp:uid=101,gid=101,mode=1777
    volumes:
      - ${PREVIEW_NGINX_CONFIG:?PREVIEW_NGINX_CONFIG is required}:/etc/nginx/nginx.conf:ro
      - ${PREVIEW_TLS_CERT_PATH:?PREVIEW_TLS_CERT_PATH is required}:/etc/nginx/tls/fullchain.pem:ro
      - ${PREVIEW_TLS_KEY_PATH:?PREVIEW_TLS_KEY_PATH is required}:/etc/nginx/tls/privkey.pem:ro
      - ${PREVIEW_AUTH_FILE_PATH:?PREVIEW_AUTH_FILE_PATH is required}:/etc/nginx/auth/.htpasswd:ro

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:
