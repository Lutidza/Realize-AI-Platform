# @file compose.yaml
# @version 1.0.1
# @date 2026-10-12
# @description Запускает PostgreSQL, приложение и Media worker с постоянным хранилищем.

name: realize-e-commerce

services:
  postgres:
    image: postgres:15.18-bookworm@sha256:e8db9bd3e9e1751eb639fb17be53cc6d1b62a322adf75b99e791767a7a16ce69
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realize_ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-realize}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    image: ${REALIZE_IMAGE:-realize-ai-platform:local}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    environment: &payload-environment
      DATABASE_URI: ${COMPOSE_DATABASE_URI:?COMPOSE_DATABASE_URI is required}
      DATABASE_URL: ${COMPOSE_DATABASE_URI:?COMPOSE_DATABASE_URI is required}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:3000}
      PAYLOAD_PUBLIC_SITE_URL: ${PAYLOAD_PUBLIC_SITE_URL:-http://localhost:3000}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      MEDIA_PRIVATE_STORAGE_DIR: /app/.data/media
      PREVIEW_SECRET: ${PREVIEW_SECRET:?PREVIEW_SECRET is required}
      REALIZE_AI_CONTROL_PLANE_TOKEN: ${REALIZE_AI_CONTROL_PLANE_TOKEN:-}
      REALIZE_AI_CONTROL_PLANE_URL: ${REALIZE_AI_CONTROL_PLANE_URL:-}
      REALIZE_AI_RUNTIME_MODE: ${REALIZE_AI_RUNTIME_MODE:-central-control-plane}
      REALIZE_INTEGRATIONS_ENCRYPTION_KEY: ${REALIZE_INTEGRATIONS_ENCRYPTION_KEY:-}
      RELEASE_ID: ${RELEASE_ID:-development}
      SITE_NAME: ${SITE_NAME:-Realize — AI Platform}
      COMPANY_NAME: ${COMPANY_NAME:-Realize}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    tmpfs:
      - /app/.next/standalone/.next/cache:uid=1001,gid=1001,mode=0750
      - /tmp:uid=1001,gid=1001,mode=1777
    volumes:
      - media-data:/app/public/media
      - media-private-data:/app/.data/media

  media-worker:
    image: ${REALIZE_IMAGE:-realize-ai-platform:local}
    build:
      context: .
      target: runtime
    command:
      [
        "node",
        "--no-deprecation",
        "node_modules/payload/bin.js",
        "run",
        "scripts/runtime/runMediaJobs.controller.ts",
      ]
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 5m
    depends_on:
      postgres:
        condition: service_healthy
    environment: *payload-environment
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=1777
    volumes:
      - media-data:/app/public/media:ro
      - media-private-data:/app/.data/media

volumes:
  media-data:
  media-private-data:
  postgres-data:
